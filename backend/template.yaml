AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Ravenloft O Inverno dos Mortos - backend

Parameters:
  AdminCodeHash:
    Type: String
    NoEcho: true
  TokenSigningSecret:
    Type: String
    NoEcho: true
  AllowedOrigin:
    Type: String
    Default: "http://localhost:5173"
  OpenAiApiKey:
    Type: String
    NoEcho: true
    Default: ""
  OpenAiModel:
    Type: String
    Default: "gpt-4o-mini"
  OpenAiImageModel:
    Type: String
    Default: "gpt-image-1"
  OpenAiImageSize:
    Type: String
    Default: "1536x1024"
  OpenAiImageQuality:
    Type: String
    Default: "medium"
    AllowedValues: ["low", "medium", "high"]
  OpenAiImageInputFidelity:
    Type: String
    Default: "high"
    Description: "Empty disables the parameter. gpt-image-2 rejects it; gpt-image-1.5 accepts it."

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs22.x

Resources:
  GameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ravenloft-game
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ravenloft-images-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForImages
            Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${ImagesBucket.Arn}/*"

  SharpLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: ravenloft-sharp
      Description: sharp image library with linux-x64 native binaries
      ContentUri: layers/sharp/
      CompatibleRuntimes:
        - nodejs22.x
      CompatibleArchitectures:
        - x86_64

  SeedImagesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: ravenloft-seed-images
      Description: Canonical seed images for the visual encyclopedia (mounted at /opt/seed-images)
      ContentUri: layers/seed-images/
      CompatibleRuntimes:
        - nodejs22.x

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      CodeUri: dist/
      Layers:
        - !Ref SharpLayer
        - !Ref SeedImagesLayer
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
          CAMPAIGN_ID: winter-dead
          SEED_IMAGE_DIR: /opt/seed-images
          ADMIN_CODE_HASH: !Ref AdminCodeHash
          TOKEN_SIGNING_SECRET: !Ref TokenSigningSecret
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          OPENAI_API_KEY: !Ref OpenAiApiKey
          OPENAI_MODEL: !Ref OpenAiModel
          OPENAI_IMAGE_MODEL: !Ref OpenAiImageModel
          OPENAI_IMAGE_SIZE: !Ref OpenAiImageSize
          OPENAI_IMAGE_QUALITY: !Ref OpenAiImageQuality
          OPENAI_IMAGE_INPUT_FIDELITY: !Ref OpenAiImageInputFidelity
          IMAGES_BUCKET: !Ref ImagesBucket
          VISUAL_WORKER_FUNCTION_NAME: !Ref VisualWorkerFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
                - dynamodb:ConditionCheckItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt GameTable.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub "${ImagesBucket.Arn}/*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt VisualWorkerFunction.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  VisualWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: visualWorkerHandler.handler
      CodeUri: dist/
      Timeout: 900
      MemorySize: 1024
      Layers:
        - !Ref SharpLayer
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
          CAMPAIGN_ID: winter-dead
          ADMIN_CODE_HASH: !Ref AdminCodeHash
          TOKEN_SIGNING_SECRET: !Ref TokenSigningSecret
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          OPENAI_API_KEY: !Ref OpenAiApiKey
          OPENAI_MODEL: !Ref OpenAiModel
          OPENAI_IMAGE_MODEL: !Ref OpenAiImageModel
          OPENAI_IMAGE_SIZE: !Ref OpenAiImageSize
          OPENAI_IMAGE_QUALITY: !Ref OpenAiImageQuality
          OPENAI_IMAGE_INPUT_FIDELITY: !Ref OpenAiImageInputFidelity
          IMAGES_BUCKET: !Ref ImagesBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !GetAtt GameTable.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub "${ImagesBucket.Arn}/*"

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

Outputs:
  ApiBaseUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Value: !Ref GameTable
