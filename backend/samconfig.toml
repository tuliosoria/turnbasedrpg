version = 0.1

[default.global.parameters]
stack_name = "ravenloft-winter"

[default.deploy.parameters]
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
# Image settings live here so `npm run deploy:backend` applies them every time.
# CloudFormation preserves an existing parameter's value when it is not passed,
# so relying on template defaults alone means a changed default silently does
# nothing on an existing stack — which is exactly how the synchronous quality
# stayed on "medium" after the default was lowered.
#
# The two profiles are deliberately different:
#   OpenAiImage*      -> the visual-canon worker (900s budget, quality matters)
#   OpenAiSyncImage*  -> House emblems and turn images, generated inside the
#                        HTTP request, which API Gateway caps at 30s
parameter_overrides = [
  # As origens que podem falar com a API. O domínio puro vem primeiro porque é
  # o oficial.
  #
  # O www está aqui porque o Amplify o criou SERVINDO o app, e não
  # redirecionando: uma regra de redirecionamento por host não pegou nem depois
  # de dois minutos. Enquanto ele servir, ele é uma terceira origem — e sem
  # esta linha o site abria em www e não carregava a campanha.
  "AllowedOrigin=https://valdrenrpg.com,https://www.valdrenrpg.com,https://main.d1emmrcvmpw55g.amplifyapp.com",
  "OpenAiImageModel=gpt-image-2",
  "OpenAiImageSize=1536x1024",
  "OpenAiImageQuality=medium",
  "OpenAiImageInputFidelity=none",
  "OpenAiSyncImageModel=gpt-image-1",
  "OpenAiSyncImageSize=1024x1024",
  "OpenAiSyncImageQuality=low",
]
